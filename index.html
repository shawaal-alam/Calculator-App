<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bgimage">

        <div class="calculator">
        <table border="1">
            <div>
            <input type="text" placeholder="0" id="input">
        
            </div>
            <tbody>
                <tr>
                    <td onclick="allclear()">AC</td>
                    <td onclick="deleteone()">DE</td>
                    <td onclick="addvalue('%')">%</td>
                    <td class="td-style" onclick="addvalue('/')">/</td>
                </tr>
                <tr>
                    <td onclick="addvalue(7)">7</td>
                    <td onclick="addvalue(8)" >8</td>
                    <td onclick="addvalue(9)">9</td>
                    <td class="td-style" onclick="addvalue('*')">*</td>
                </tr>
                <tr>
                    <td onclick="addvalue(4)" >4</td>
                    <td onclick="addvalue(5)"  >5</td>
                    <td onclick="addvalue(6)" >6</td>
                    <td class="td-style" onclick="addvalue('-')">-</td>
                </tr>
                <tr>
                    <td onclick="addvalue(1)" >1</td>
                    <td onclick="addvalue(2)" >2</td>
                    <td onclick="addvalue(3)" >3</td>
                    <td class="td-style" onclick="addvalue('+')" >+</td>
                </tr>
                <tr>
                    <td colspan="2" onclick="addvalue(0)">0</td>
                    <td class="td-style"  onclick="addvalue('.')">.</td>
                    <td class="td-style" onclick="calc('=')">=</td>
                </tr>
            </tbody>
         </table>
        
     </div> 
 
    </div>
    


</body>
<script src="app.js"></script>
</html>
